<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12372f">
  <link rel="stylesheet" href="/style.css">
  <title>KODA EUDR WORKSPACE</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img src="/koda-logo.png" alt="KODA official logo"><div class="brand-caption">EUDR <span>WORKSPACE</span></div></div>
      <div class="sidebar-section">OPERATIONS</div>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-footer"><span class="pilot-mark">STAGING · 2.1</span><p>Structured evidence for transparent human review</p></div>
    </aside>
    <div class="workspace-shell">
      <header class="topbar"><div class="topbar-context"><span class="topbar-dot"></span><span id="pageTitle">Workspace</span></div><div class="topbar-account"><div class="language-switch" role="group" aria-label="Language"><button data-language="vi" aria-label="Tiếng Việt">VI</button><span aria-hidden="true">|</span><button data-language="en" aria-label="English">EN</button></div><span id="identity"></span><button id="changePassword" class="quiet-button" hidden>Change password</button><button id="logout" class="quiet-button" hidden>Sign out</button></div></header>
      <div class="content"><div id="msg" role="status" aria-live="polite"></div><main id="main">Loading your workspace…</main></div>
    </div>
  </div>
  <dialog id="drawer"><button id="closeDrawer" aria-label="Close dialog">Close</button><div id="drawerContent"></div></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
