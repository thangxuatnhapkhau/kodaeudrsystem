<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12372f">
  <link rel="stylesheet" href="/style.css?v=2.4.4">
  <link rel="icon" type="image/png" href="/eudr-workspace-icon.png?v=20261007">
  <link rel="apple-touch-icon" href="/eudr-workspace-icon.png?v=20261007">
  <title>KODA EUDR WORKSPACE</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img src="/koda-logo.png" alt="KODA official logo"><div class="brand-caption">EUDR <span>WORKSPACE</span></div></div>
      <div class="sidebar-section" data-i18n="Operations">OPERATIONS</div>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-footer"><span class="pilot-mark">STAGING 2.4.4</span><p data-i18n="Evidence readiness supports human review. It is not a regulatory decision.">Evidence readiness supports human review. It is not a regulatory decision.</p></div>
    </aside>
    <div class="workspace-shell">
      <header class="topbar"><div class="topbar-context"><span class="topbar-dot"></span><span id="pageTitle">Workspace</span></div><div class="topbar-account"><label class="language-control"><span class="sr-only">Language</span><select id="language" aria-label="Language"><option value="en">EN</option><option value="vi">VI</option></select></label><span id="identity"></span><button id="logout" class="quiet-button" hidden data-i18n="Sign out">Sign out</button></div></header>
      <div class="content"><div id="msg" role="status" aria-live="polite"></div><main id="main">Loading your workspace…</main></div>
    </div>
  </div>
  <dialog id="drawer"><button id="closeDrawer" aria-label="Close dialog" data-i18n="Close">Close</button><div id="drawerContent"></div></dialog>
  <script src="/i18n.js?v=2.4.4" defer></script>
  <script src="/app.js?v=2.4.4" defer></script>
</body>
</html>
